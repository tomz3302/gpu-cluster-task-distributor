global
    maxconn 2000

defaults
    mode http
    timeout connect 10s
    timeout client 60s
    timeout server 60s

frontend llm_frontend
    bind *:8080
    default_backend balanced_gpu_cluster

# --- 1. THE LOAD BALANCER ---
backend balanced_gpu_cluster
    balance leastconn


    server node-colab-ngrok 127.0.0.1:10001 check maxconn 10
    server node-kaggle-pinggy 127.0.0.1:10002 check maxconn 10

# --- 2. THE NGROK PROXY (COLAB) ---
listen ngrok_node
    bind 127.0.0.1:10001

    http-request set-header Host aubrey-nonocclusive-eerily.ngrok-free.dev
    server tunnel aubrey-nonocclusive-eerily.ngrok-free.dev:443 ssl verify none check sni str(aubrey-nonocclusive-eerily.ngrok-free.dev)

# --- 3. THE PINGGY PROXY (KAGGLE) ---
listen pinggy_node
    bind 127.0.0.1:10002

    http-request set-header Host zeczk-34-48-195-144.run.pinggy-free.link
    http-request set-header X-Pinggy-No-Screen true
    server tunnel zeczk-34-48-195-144.run.pinggy-free.link:80 check 

listen stats
    bind *:8404
    stats enable
    stats uri /stats
    stats refresh 5s
