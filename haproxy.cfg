# =============================================================================
# HAProxy Configuration — LLM Load Balancer for Colab/ngrok Workers
# Latest HAProxy (Docker image: haproxy:latest)
# =============================================================================
# Usage:
#   docker run -d \
#     --name haproxy-lb \
#     -p 8080:8080 \
#     -p 8404:8404 \
#     -v $(pwd)/haproxy.cfg:/usr/local/etc/haproxy/haproxy.cfg:ro \
#     haproxy:latest
#
# To add more Colab workers, uncomment and fill in the server lines
# in the backend section (up to 10 workers supported, slots pre-wired).
# =============================================================================

# -----------------------------------------------------------------------------
# Global settings
# -----------------------------------------------------------------------------
global
    log         stdout  format raw  local0  info
    maxconn     50000
    nbthread    4

    # TLS / SSL hardening (used when HAProxy itself terminates TLS — optional)
    ssl-default-bind-ciphersuites   TLS_AES_128_GCM_SHA256:TLS_AES_256_GCM_SHA384:TLS_CHACHA20_POLY1305_SHA256
    ssl-default-bind-options        prefer-client-ciphers no-sslv3 no-tlsv10 no-tlsv11

# -----------------------------------------------------------------------------
# Default settings (inherited by all frontends/backends unless overridden)
# -----------------------------------------------------------------------------
defaults
    log         global
    mode        http
    option      httplog
    option      dontlognull
    option      forwardfor          # Add X-Forwarded-For header
    option      http-server-close   # Efficient connection reuse


    timeout queue           600s  
    timeout connect         10s
    timeout client          600s
    timeout server          600s
    timeout http-request    30s

    retries     3
    # If the first worker fails, try again instead of giving up
    option      redispatch        # Max time to receive full HTTP request headers


# -----------------------------------------------------------------------------
# Stats / monitoring UI  →  http://localhost:8404/stats
# -----------------------------------------------------------------------------
frontend stats
    bind *:8404
    stats enable
    stats uri /stats
    stats refresh 5s
    stats show-legends
    stats show-node
    stats auth admin:admin          # Change to a real password in production!
    stats admin if TRUE             # Allows enabling/disabling servers from UI

# -----------------------------------------------------------------------------
# Main frontend — what your benchmark script hits on :8080
# -----------------------------------------------------------------------------
frontend llm_frontend
    bind *:8080
    option          httplog

    # Health-check endpoint answered directly by HAProxy (no backend needed)
    acl             is_health  path /health
    http-request    return status 200 content-type "application/json" string "{\"status\":\"ok\"}" if is_health

    # Route everything else to the worker pool
    default_backend colab_workers

# -----------------------------------------------------------------------------
# Backend — Colab workers exposed via ngrok HTTPS tunnels
#
# ngrok tunnels are HTTPS, so HAProxy will forward to them over SSL.
# The "ngrok-skip-browser-warning: true" header is injected on every
# request so ngrok does not redirect to its interstitial warning page.
#
# Replace the placeholder URLs with your actual ngrok hostnames, e.g.:
#   abc123.ngrok-free.app   (ngrok free tier)
#   abc123.ngrok.io         (ngrok paid tier)
#
# Server line anatomy:
#   server <name> <host>:443 ssl verify none check inter 10s rise 2 fall 3 weight 1
#
#   ssl verify none  — ngrok certs rotate; skip chain verification
#   check            — enable active health checks
#   inter 10s        — check every 10 s
#   rise 2           — 2 consecutive successes → mark UP
#   fall 3           — 3 consecutive failures  → mark DOWN
#   weight 1         — equal weight (leastconn balances by queue depth)
# -----------------------------------------------------------------------------
backend colab_workers
    balance         leastconn       # Best for variable-length LLM jobs

    http-request set-header Host aubrey-nonocclusive-eerily.ngrok-free.dev
    # Inject the ngrok header on every proxied request
    http-request    set-header ngrok-skip-browser-warning "true"

    # --- Active HTTP health check ---
    # Must send Host header — ngrok returns 400 without it
    option          httpchk GET /health HTTP/1.1
    http-check      send hdr Host aubrey-nonocclusive-eerily.ngrok-free.dev hdr ngrok-skip-browser-warning true                   
    http-check      expect status 200


    # -------------------------------------------------------------------------
    # Worker 01 — ACTIVE (replace URL with your ngrok hostname)
    # -------------------------------------------------------------------------
    server  colab-worker-01  aubrey-nonocclusive-eerily.ngrok-free.dev:443  maxconn 10 ssl verify none  check inter 10s rise 2 fall 3  weight 1

    # -------------------------------------------------------------------------
    # Workers 02-10 — add as you spin up more Colab instances
    # (remove the leading '#' and fill in the hostname)
    # -------------------------------------------------------------------------
    #server  colab-worker-02  your-ngrok-hostname-02.ngrok-free.app:443  ssl verify none  check inter 10s rise 2 fall 3  weight 1
    #server  colab-worker-03  your-ngrok-hostname-03.ngrok-free.app:443  ssl verify none  check inter 10s rise 2 fall 3  weight 1
    #server  colab-worker-04  your-ngrok-hostname-04.ngrok-free.app:443  ssl verify none  check inter 10s rise 2 fall 3  weight 1
    #server  colab-worker-05  your-ngrok-hostname-05.ngrok-free.app:443  ssl verify none  check inter 10s rise 2 fall 3  weight 1
    #server  colab-worker-06  your-ngrok-hostname-06.ngrok-free.app:443  ssl verify none  check inter 10s rise 2 fall 3  weight 1
    #server  colab-worker-07  your-ngrok-hostname-07.ngrok-free.app:443  ssl verify none  check inter 10s rise 2 fall 3  weight 1
    #server  colab-worker-08  your-ngrok-hostname-08.ngrok-free.app:443  ssl verify none  check inter 10s rise 2 fall 3  weight 1
    #server  colab-worker-09  your-ngrok-hostname-09.ngrok-free.app:443  ssl verify none  check inter 10s rise 2 fall 3  weight 1
