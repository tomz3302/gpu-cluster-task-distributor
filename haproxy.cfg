#-------------------------------------------------------------------------------
# HAProxy Configuration
# Load balancer for 5 ZeroTier-connected worker nodes
#-------------------------------------------------------------------------------

global
    log         stdout format raw local0 info
    maxconn     50000
    daemon

#-------------------------------------------------------------------------------
defaults
#-------------------------------------------------------------------------------
defaults
    log                     global
    mode                    http
    option                  httplog
    option                  dontlognull
    option                  forwardfor
    option                  http-server-close
    timeout connect         5s
    timeout client          30s
    timeout server          30s
    timeout check           3s
    retries                 3

#-------------------------------------------------------------------------------
# Stats Dashboard
# Access at: http://<your-ip>:8404/stats
#-------------------------------------------------------------------------------
frontend stats
    bind *:8404
    stats enable
    stats uri /stats
    stats realm HAProxy\ Statistics
    stats auth admin:admin              # Change username:password before deploying!
    stats refresh 5s
    stats show-legends
    stats show-node
    stats admin if TRUE                 # Allows enabling/disabling servers from UI

#-------------------------------------------------------------------------------
# Frontend — accepts incoming HTTP traffic
#-------------------------------------------------------------------------------
frontend http_front
    bind *:80
    default_backend worker_nodes

#-------------------------------------------------------------------------------
# Backend — 5 worker nodes connected via ZeroTier
#
# Replace the IPs below with your friends' actual ZeroTier IP addresses.
# ZeroTier IPs are typically in the 10.x.x.x or 172.x.x.x range.
# Run `zerotier-cli listpeers` or check your ZeroTier Central dashboard.
#
# Health check: GET /health every 5s; node marked DOWN after 2 failures,
#               and back UP after 3 successes.
#-------------------------------------------------------------------------------
backend worker_nodes
    balance             roundrobin
    option              httpchk GET /health HTTP/1.1\r\nHost:\ healthcheck

    default-server      inter 5s fall 2 rise 3 slowstart 30s

    server worker1      10.147.0.11:8080 check   # Friend 1 — replace ZeroTier IP
    server worker2      10.147.0.12:8080 check   # Friend 2 — replace ZeroTier IP
    server worker3      10.147.0.13:8080 check   # Friend 3 — replace ZeroTier IP
    server worker4      10.147.0.14:8080 check   # Friend 4 — replace ZeroTier IP
    server worker5      10.147.0.15:8080 check   # Friend 5 — replace ZeroTier IP