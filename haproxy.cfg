#-------------------------------------------------------------------------------
# HAProxy Configuration
# Load balancer for 5 ZeroTier-connected worker nodes
#-------------------------------------------------------------------------------

global
    log         stdout format raw local0 info
    maxconn     50000
    daemon

#-------------------------------------------------------------------------------
defaults
#-------------------------------------------------------------------------------
    log                     global
    mode                    http
    option                  httplog
    option                  dontlognull
    option                  forwardfor
    option                  http-server-close
    timeout connect         5s
    timeout client          30s
    timeout server          30s
    timeout check           3s
    timeout queue           200s
    retries                 3

#-------------------------------------------------------------------------------
# Stats Dashboard
# Access at: http://<your-ip>:8404/stats
#-------------------------------------------------------------------------------
frontend stats
    bind *:8404
    stats enable
    stats uri /stats
    stats realm HAProxy\ Statistics
    stats auth admin:admin            
    stats refresh 5s
    stats show-legends
    stats show-node
    stats admin if TRUE 

#-------------------------------------------------------------------------------
# Frontend — accepts incoming HTTP traffic
#-------------------------------------------------------------------------------
frontend http_front
    bind *:8080
    default_backend worker_nodes

#-------------------------------------------------------------------------------
# Backend — 5 worker nodes connected via ZeroTier
#
#
# Health check: GET /health every 5s; node marked DOWN after 2 failures,
#               and back UP after 3 successes.
#-------------------------------------------------------------------------------
backend worker_nodes
    balance             leastconn
    option              httpchk 
    option              redispatch
    http-check send    meth GET uri /health ver HTTP/1.1 hdr Host healthcheck
    http-response set-header X-Worker-Name %s
    retry-on            all-retryable-errors

    default-server      inter 5s fall 2 rise 3 slowstart 30s

    server wael      10.14.248.241:8000 check maxconn 6 
    server besheer      10.14.248.83:8000 check maxconn 6 
    server amr      10.14.248.190:8000 check maxconn 8 
    server omar      10.14.248.171:8000 check maxconn 4
